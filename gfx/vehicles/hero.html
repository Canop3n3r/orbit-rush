  const P = new THREE.Vector3(0, base + (s.probeY ?? 0.4) * H, 0), right = new THREE.Vector3().subVectors(camera.position, P).cross(new THREE.Vector3(0, 1, 0)).normalize();
  const a = P.clone().project(camera), b = P.clone().addScaledVector(right, rV).project(camera);
  const px = v => [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight];
  const [cx, cy] = px(a), [bx] = px(b);
  const box = new THREE.Box3().setFromObject(cur), t0 = box.min.clone().project(camera), t1 = new THREE.Vector3(0, box.max.y, 0).project(camera);
  return { tris: Math.round(tris), cx, cy, rpx: Math.abs(bx - cx), fill: Math.abs(t1.y - new THREE.Vector3(0, box.min.y, 0).project(camera).y) / 2 }; }
renderer.setAnimationLoop(() => pp.render());
window.__hero = { shot, ready: true };
</script></body></html>
