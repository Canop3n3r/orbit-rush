<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Orbit Rush hero renders</title>
<style>body{margin:0;background:#000;overflow:hidden}#cap{position:fixed;left:10px;bottom:8px;color:#fff8;font:12px system-ui}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"}}</script>
</head><body><div id="cap"></div>
<script type="module">
// Hero renders in the game's own lighting: same renderer setup as main.js (ACES 1.05, hemi + sun 3.0), the game's
// procedural env map, sun glow and bloom post from gfx/gfx.js (imported, not modified), concrete pad texture.
import * as THREE from 'three/webgpu';
import * as GX from '../gfx.js?v=f2';
import { VEHICLES, build, setLegs } from './vehicles.js?v=art1';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setSize(innerWidth, innerHeight); document.body.prepend(renderer.domElement); await renderer.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x7ab8ff); scene.fog = new THREE.FogExp2(0xa9c8e8, 0.0009);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x334433, 1.0));
const sunL = new THREE.DirectionalLight(0xfff4e6, 3.0); scene.add(sunL); sunL.position.set(0.9, 0.35, 0.3);
scene.environment = GX.envTexture();
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: GX.glowTexture(), color: new THREE.Color(6, 5.4, 4.6), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(sun);
const conc = GX.concreteTexture(); conc.repeat.set(24, 24);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1500, 64), new THREE.MeshStandardMaterial({ map: conc, roughness: 0.92 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 20000);
const post = GX.makePost(renderer, scene, camera); await post.enable(!q.has('nobloom')); post.strength = 0.35;
let cur = null;
// shot: { id, opts, cam:[x,y,z] (in vehicle heights), aim:[x,y,z] (heights), fov, sun:[x,y,z] }
async function shot(s) { if (cur) scene.remove(cur); const h = VEHICLES[s.id].height;
  cur = build(s.id, { detail: s.lo ? 'lo' : 'hi', ...(s.opts || {}) }); scene.add(cur);
  if (s.legs !== undefined) for (const L of cur.userData.legs || []) setLegs(L, s.legs);
  camera.fov = s.fov || 35; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  camera.position.set(...s.cam.map(v => v * h)); camera.lookAt(new THREE.Vector3(...s.aim.map(v => v * h)));
  const sd = new THREE.Vector3(...(s.sun || [0.8, 0.45, 0.6])).normalize(); sunL.position.copy(sd); sun.position.copy(sd.clone().multiplyScalar(9000)); sun.scale.setScalar(900);
  let tris = 0; cur.traverse(m => { if (m.isMesh) tris += m.geometry.attributes.position.count / 3; });
  document.getElementById('cap').textContent = `${s.id} · ${Math.round(tris)} tris`;
  for (let i = 0; i < 3; i++) { post.render(); await new Promise(r => requestAnimationFrame(r)); }
  return { tris: Math.round(tris) }; }
window.__hero = { shot, ready: true };
</script></body></html>
